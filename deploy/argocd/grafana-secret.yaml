apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahul6364/cloud-native-chat-platform.git
    targetRevision: restore-kind-gitops
    path: deploy/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
