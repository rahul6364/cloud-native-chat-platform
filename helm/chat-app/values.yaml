# Shared defaults; apply the appropriate environment overlay with -f.
namespace: chat-app
networkPolicy:
  enabled: false
  monitoringNamespace: monitoring
metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    prometheusRelease: monitoring-stack
frontend:
  replicas: 2
  image:
    repository: rahul6364/full-stack-chatapp-frontend
    tag: 9d557ab
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  env:
    nodeEnv: production
    backendUrl: http://backend:5001
  probes:
    readiness:
      path: /
      port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      path: /
      port: 80
      initialDelaySeconds: 20
      periodSeconds: 15
      failureThreshold: 3
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
backend:
  replicas: 2
  image:
    repository: rahul6364/full-stack-chatapp-backend
    tag: 9d557ab
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001
    sessionAffinity: None
  env:
    port: '5001'
    nodeEnv: production
  secretRef:
    name: backend-secrets
    keys:
      mongodbUri: mongodb-uri
      jwtSecret: jwt-secret
      cloudinaryCloudName: cloudinary-cloud-name
      cloudinaryApiKey: cloudinary-api-key
      cloudinaryApiSecret: cloudinary-api-secret
  probes:
    readiness:
      path: /health
      port: 5001
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      path: /health
      port: 5001
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 5
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
mongodb:
  replicas: 1
  image:
    repository: mongo
    tag: '8.0'
    pullPolicy: IfNotPresent
  service:
    port: 27017
    targetPort: 27017
    annotations:
      argocd.argoproj.io/sync-options: Replace=true
  auth:
    existingSecret: mongodb-credentials
  persistence:
    size: 1Gi
    storageClassName: ''
    accessModes:
      - ReadWriteOnce
  probes:
    startup:
      port: 27017
      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 40
    readiness:
      port: 27017
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      port: 27017
      initialDelaySeconds: 60
      periodSeconds: 15
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 250m
  pdb:
    enabled: true
    maxUnavailable: 0
configmap:
  nginxConf: "server {\n    listen 80;\n    server_name localhost;\n\n    root /usr/share/nginx/html;\n\
    \    index index.html;\n\n    location / {\n        try_files $uri $uri/ /index.html;\n\
    \    }\n\n    location /api/ {\n        proxy_pass http://backend.chat-app.svc.cluster.local:5001/api/;\n\
    \        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n\
    \        proxy_set_header Connection \"upgrade\";\n        proxy_set_header Host\
    \ $host;\n        proxy_cache_bypass $http_upgrade;\n    }\n\n    location /socket.io/\
    \ {\n        proxy_pass http://backend.chat-app.svc.cluster.local:5001/socket.io/;\n\
    \        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n\
    \        proxy_set_header Connection \"Upgrade\";\n        proxy_set_header Host\
    \ $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header\
    \ X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto\
    \ $scheme;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n"
ingress:
  enabled: false
  className: ''
  annotations: {}
  host: chat-app.com
  paths:
    api: /api
    socket: /socket.io
    root: /
sealedSecret:
  enabled: false
  name: backend-secrets
mongodbSealedSecret:
  enabled: false
  name: mongodb-credentials
  encryptedData:
    username: ''
    password: ''

# Redis for distributed Socket.IO communication
redis:
  enabled: true
  replicas: 1
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
