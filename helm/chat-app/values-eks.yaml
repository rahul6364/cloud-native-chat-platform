networkPolicy:
  enabled: true
  # Must match the Terraform VPC CIDR
  albCidr: "10.0.0.0/16"
  monitoringNamespace: monitoring

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
  host: ""
  paths:
    api: /api
    socket: /socket.io
    root: /

# ExternalSecrets will replace
sealedSecret:
  enabled: false
  name: backend-secrets
mongodbSealedSecret:
  enabled: false
  name: mongodb-credentials
  encryptedData:
    username: ''
    password: ''

mongodb:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: gp3
  resources:
    requests:
      cpu: 50m
  pdb:
    enabled: false

frontend:
  replicas: 2
  image:
    repository: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/chatapp-frontend
    tag: 8ac0fcb
    pullPolicy: IfNotPresent
  service:
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /
  resources:
    requests:
      cpu: 25m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true

backend:
  replicas: 2
  image:
    repository: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/chatapp-backend
    tag: 8ac0fcb
    pullPolicy: IfNotPresent
  service:
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
  env:
    # Flip to true when HTTPS is added
    cookieSecure: "false"
  resources:
    requests:
      cpu: 50m
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
