# Shared defaults; apply the appropriate environment overlay with -f.
networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik
  monitoringNamespace: monitoring
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: chat-app.local
  paths:
    api: /api
    socket: /socket.io
    root: /
sealedSecret:
  enabled: true
  name: backend-secrets
  encryptedData:
    cloudinaryApiKey: 
    cloudinaryApiSecret: 
    cloudinaryCloudName: 
    jwtSecret: 
    mongodbUri: 
mongodbSealedSecret:
  enabled: true
  name: mongodb-credentials
  encryptedData:
    username: ''
    password: ''
