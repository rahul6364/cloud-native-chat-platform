{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: {{ include "chat-app.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "chat-app.labels.frontend" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
{{- if .Values.networkPolicy.albCidr }}
        # AWS ALB with target-type ip sends traffic from VPC IPs, not from the
        # ingress-controller pods, so the namespaceSelector rule alone would
        # block it. Allow the VPC CIDR explicitly (must match the Terraform VPC).
        - ipBlock:
            cidr: {{ .Values.networkPolicy.albCidr | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.targetPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ include "chat-app.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "chat-app.labels.backend" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chat-app.labels.frontend" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
{{- if .Values.networkPolicy.albCidr }}
    - from:
        # ALB with target-type ip: traffic originates from VPC IPs (see note above).
        - ipBlock:
            cidr: {{ .Values.networkPolicy.albCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
  namespace: {{ include "chat-app.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "chat-app.labels.mongodb" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chat-app.labels.backend" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.mongodb.service.targetPort }}

---
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: {{ include "chat-app.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chat-app.labels.backend" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}