# EC2 Kind deployment overrides

frontend:
  replicaCount: 1
  image:
    repository: rahul6364/full-stack-chatapp-frontend
    tag: 3fd78d9
    pullPolicy: IfNotPresent
backend:
  replicaCount: 1
  image:
    repository: rahul6364/full-stack-chatapp-backend
    tag: 3fd78d9
