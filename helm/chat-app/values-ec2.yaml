  name: backend-secrets
  encryptedData:
    cloudinaryApiKey: 
    cloudinaryApiSecret: 
    cloudinaryCloudName: 
    jwtSecret: 
    mongodbUri: 
mongodbSealedSecret:
  enabled: true
  name: mongodb-credentials
  encryptedData:
    username: 
    password: 
